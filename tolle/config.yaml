# Home Assistant add-on configuration
# https://developers.home-assistant.io/docs/add-ons/configuration
name: Tolle Bible Study
version: "0.3.2"
slug: tolle
description: >-
  AI-assisted Bible study – notes, passage research, insights, a study builder,
  calling discernment and a reading tracker. Ollama, ChatGPT, Gemini, Claude or on-device AI.
url: https://github.com/shotgn16/Tolle
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Opens from the Home Assistant sidebar
ingress: true
ingress_port: 8099
panel_icon: mdi:book-open-page-variant
panel_title: Tolle

# Lets Tolle send notifications through your notify services (e.g. Companion app)
homeassistant_api: true

# The ONLY setting outside the app: an optional direct port for the mobile apps
# or other devices on your network. Leave empty to use the sidebar only.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct access for the Tolle mobile apps / other devices (optional)"


# Pre-built images from GitHub Actions (see .github/workflows/build.yaml).
# Comment this line out to build the add-on locally on your Home Assistant instead.
# image: "ghcr.io/shotgn16/{arch}-addon-tolle"
