<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tolle</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" hidden>
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="34" height="34">
        <div><strong data-brand-name>Tolle</strong><small class="motto" title="Augustine heard these words before he picked up the Scriptures (Confessions, Book VIII)"><em>Tolle lege</em>, take up and read</small></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <header id="topbar" class="topbar" hidden>
      <button id="menu-btn" class="icon-btn" aria-label="Open menu"></button>
      <strong data-brand-name>Tolle</strong>
      <a id="tasks-btn" class="icon-btn tasks-btn" href="#/tasks" aria-label="Tasks" title="Tasks"><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg><span class="count" data-task-count hidden></span></a>
      <span id="ai-chip" class="chip ai"></span>
    </header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Quick navigation" hidden></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="core/app.js"></script>
</body>
</html>
