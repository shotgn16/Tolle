# Builds every Tolle download and publishes them as a GitHub Release (the same way as LifeHub).
#
#   Actions → "Build installers" → Run workflow, version 0.3.0  → builds everything, then creates the
#                                                                  v0.3.0 tag and release itself
#   Actions → "Build installers" → Run workflow, version empty  → builds everything; download the files
#                                                                  from the run page (no release)
#   git tag v0.3.0 && git push origin v0.3.0                     → same as running it with 0.3.0
#
# Files (unsigned unless the secrets below are set):
#   Tolle-<v>-Android.apk, Tolle-<v>-iPhone-iPad-unsigned.ipa,
#   Tolle-<v>-macOS-AppleSilicon.dmg, Tolle-<v>-macOS-Intel.dmg, Tolle-<v>-Windows-x64-Setup.exe,
#   Tolle-<v>-Linux-x86_64.AppImage / -arm64.AppImage, Tolle-<v>-Linux-amd64.deb / -arm64.deb,
#   Tolle-Server-<v>-<platform>.tar.gz/.zip (headless), install.sh, install.ps1, SHA256SUMS.txt
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       sign the Android app with your own key (see docs/developer/releasing.md). Without them the APK is
#       signed with a temporary key: it installs fine, but a new build can't update an old one.
#   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#       sign and notarise the macOS app (needs an Apple Developer account).
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#       sign the Windows installer.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r tolle/app/requirements.txt pytest
      - run: pytest -q tests
      - name: Test the app running on its own (phone mode)
        run: |
          python3 scripts/export-shared.py --check
          python3 tests/device/expected.py > "$RUNNER_TEMP/expected.json"
          cd tests/device && npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
          node device-mode.mjs "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/shots"
      - name: Check every screen fits phones and tablets
        run: cd tests/device && node layout.mjs "$RUNNER_TEMP/shots/layout"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - id: v
        name: Version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; fi
          v="${v#v}"
          if [ -n "$v" ]; then
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$' || { echo "::error::Use a version like 0.3.0"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v=$(cat tolle/app/VERSION)
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Tolle $v"
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}

  # ------------------------------------------------------------------ the server program
  server:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    id: linux-x64,   label: Linux-x64,          archive: tar.gz }
          - { os: ubuntu-24.04-arm, id: linux-arm64, label: Linux-arm64,        archive: tar.gz }
          - { os: macos-latest,     id: macos-arm64, label: macOS-AppleSilicon, archive: tar.gz }
          - { os: macos-15-intel,   id: macos-x64,   label: macOS-Intel,        archive: tar.gz }
          - { os: windows-latest,   id: windows-x64, label: Windows-x64,        archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/set-version.py "${{ needs.test.outputs.version }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build tolle-server
        shell: bash
        run: |
          # constraints.txt pins versions known to work in the stand-alone program on every platform
          pip install -r tolle/app/requirements.txt -c packaging/server/constraints.txt pyinstaller
          cd packaging/server
          pyinstaller --noconfirm --distpath ../../build/server --workpath ../../build/work tolle-server.spec
      - name: Check it runs
        shell: bash
        run: |
          build/server/tolle-server/tolle-server* info --json
          build/server/tolle-server/tolle-server* selftest
      - name: Package
        shell: bash
        run: |
          V=${{ needs.test.outputs.version }}
          mkdir -p out
          cp packaging/server/README.txt build/server/tolle-server/ 2>/dev/null || true
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd build/server && 7z a -tzip ../../out/Tolle-Server-$V-${{ matrix.label }}.zip tolle-server > /dev/null)
          else
            tar -C build/server -czf out/Tolle-Server-$V-${{ matrix.label }}.tar.gz tolle-server
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.id }}
          path: out/*

  # ------------------------------------------------------------------ desktop apps + installers
  desktop:
    needs: [test, server]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    id: linux-x64,   target: --linux --x64 }
          - { os: ubuntu-24.04-arm, id: linux-arm64, target: --linux --arm64 }
          - { os: macos-latest,     id: macos-arm64, target: --mac --arm64, name: "'-c.mac.artifactName=Tolle-${version}-macOS-AppleSilicon.${ext}'" }
          - { os: macos-15-intel,   id: macos-x64,   target: --mac --x64,   name: "'-c.mac.artifactName=Tolle-${version}-macOS-Intel.${ext}'" }
          - { os: windows-latest,   id: windows-x64, target: --win --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/set-version.py "${{ needs.test.outputs.version }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: server-${{ matrix.id }}
          path: server-archive
      - name: Unpack the server program
        shell: bash
        run: |
          mkdir -p build/server
          f=$(ls server-archive/*)
          case "$f" in *.zip) 7z x -obuild/server "$f" > /dev/null ;; *) tar -C build/server -xzf "$f" ;; esac
          ls build/server/tolle-server | head
      - name: Install the .deb packaging tool (Linux ARM)
        # electron-builder downloads an Intel-only copy of fpm; on ARM runners use the system one.
        if: matrix.id == 'linux-arm64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - name: Build the installer
        shell: bash
        working-directory: packaging/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Signing is optional. A secret that isn't set arrives as an empty string, and electron-builder
          # would read an empty CSC_LINK as a file path, so remove empty values first.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm ci
          npx electron-builder ${{ matrix.target }} ${{ matrix.name }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.id }}
          path: |
            packaging/desktop/dist/*.exe
            packaging/desktop/dist/*.dmg
            packaging/desktop/dist/*.AppImage
            packaging/desktop/dist/*.deb
            packaging/desktop/dist/*.blockmap
            packaging/desktop/dist/latest*.yml

  # ------------------------------------------------------------------ Android
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/set-version.py "${{ needs.test.outputs.version }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tolle.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tolle.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – the APK is signed with a temporary debug key."
          fi
      - name: Build the APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npm run copy-web
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          V=$(cat ../../tolle/app/VERSION)
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/Tolle-$V-Android.apk
      - name: Check the APK
        run: |
          # Use the newest stable build-tools (skip previews / release candidates).
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | grep -viE 'rc|preview' | sort -V | tail -1)"
          APK=$(ls out/*.apk)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|minSdkVersion|application-label:" || true
          if ! "$BT/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt 2>&1; then
            cat apk-signature.txt
            echo "::error::The APK's signature is not valid."
            exit 1
          fi
          grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" apk-signature.txt || cat apk-signature.txt
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::This APK uses a temporary key. Add the Android signing secrets so updates install over earlier versions (docs/developer/building.md#android-recommended)."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk

  # ------------------------------------------------------------------ iPhone & iPad
  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/set-version.py "${{ needs.test.outputs.version }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build an unsigned app
        working-directory: mobile
        run: |
          npm ci
          npm run copy-web
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          V=$(cat ../tolle/app/VERSION)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../out
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/out/Tolle-$V-iPhone-iPad-unsigned.ipa" Payload)
      - name: Check the iPhone/iPad app
        run: |
          APPDIR="$RUNNER_TEMP/ipa/Payload/App.app"
          test -f "$APPDIR/public/index.html" || { echo "::error::The web app is missing from the iOS build"; exit 1; }
          plutil -extract UIDeviceFamily json -o - "$APPDIR/Info.plist"; echo " ← 1 = iPhone, 2 = iPad"
          plutil -extract CFBundleShortVersionString raw -o - "$APPDIR/Info.plist"
          plutil -extract MinimumOSVersion raw -o - "$APPDIR/Info.plist"
          du -sh "$APPDIR" "$GITHUB_WORKSPACE"/out/*.ipa
          lipo -info "$APPDIR/App"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: out/*.ipa

  # ------------------------------------------------------------------ publish
  release:
    # Publishes whatever built successfully, so one failing platform doesn't hold up the others.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.test.outputs.release == 'true' }}
    needs: [test, server, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{server-*,desktop-*,android,ios}"
          merge-multiple: true
      - name: Collect files, checksums and release notes
        run: |
          V=${{ needs.test.outputs.version }}
          cp packaging/install/install.sh packaging/install/install.ps1 artifacts/
          # The two Mac builds each write a latest-mac.yml; unsigned Mac apps can't update themselves anyway.
          rm -f artifacts/latest-mac.yml
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          ls -la artifacts
          python3 packaging/release-notes.py "$V" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.test.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --title "Tolle $tag" --notes-file notes.md
          fi
