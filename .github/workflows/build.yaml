name: Build & publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tolle/app/requirements.txt pytest
      - run: pytest -q tests

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from add-on config
        id: v
        run: |
          VERSION=$(grep -E '^version:' tolle/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Lower-case owner
        id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standalone Docker image (multi-arch)
      - name: Standalone image
        uses: docker/build-push-action@v6
        with:
          context: tolle
          file: tolle/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/tolle:latest
            ghcr.io/${{ steps.o.outputs.owner }}/tolle:${{ steps.v.outputs.version }}

      # Home Assistant add-on images, one per architecture
      - name: Add-on image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: tolle
          file: tolle/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BUILD_FROM=ghcr.io/home-assistant/base-python:3.13-alpine3.23
          labels: |
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/amd64-addon-tolle:latest
            ghcr.io/${{ steps.o.outputs.owner }}/amd64-addon-tolle:${{ steps.v.outputs.version }}
      - name: Add-on image (aarch64)
        uses: docker/build-push-action@v6
        with:
          context: tolle
          file: tolle/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: BUILD_FROM=ghcr.io/home-assistant/base-python:3.13-alpine3.23
          labels: |
            io.hass.type=addon
            io.hass.arch=aarch64
            io.hass.version=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/aarch64-addon-tolle:latest
            ghcr.io/${{ steps.o.outputs.owner }}/aarch64-addon-tolle:${{ steps.v.outputs.version }}
